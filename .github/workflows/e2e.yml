name: E2E

# Phase 3.2 browser happy path: connect -> derive -> register -> send (native +
# cross-chain relay) -> scan -> sweep, on an anvil fork of Sepolia (real deployed
# contracts, free ETH, no testnet keys). Solana stays read-only on devnet.
#
# The app consumes the published @opaquecash/* packages from npm, so no sibling
# sdk checkout/build is needed.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install app
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npx playwright test
        env:
          FORK_URL: ${{ vars.SEPOLIA_FORK_URL || 'https://ethereum-sepolia-rpc.publicnode.com' }}

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
